[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-mover"
version = "0.1.0"
description = "Safety-conscious planner and mover for tiered NAS storage"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
nas-mover = "nas_mover.cli:main"
nas-mover-test-fixtures = "nas_mover.sandbox_cli:main"
nas-mover-test-suite = "nas_mover.test_suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=nas_mover --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests requiring a dedicated NAS mover sandbox",
]

[tool.coverage.run]
branch = true
omit = [
    "src/nas_mover/__main__.py",
    "src/nas_mover/sandbox_cli.py",
    "src/nas_mover/test_suite.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
required-version = "==0.16.10"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
